name: Verify evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check evidence and documentation links
        run: python tools/inventory.py check
      - name: Install test runner
        run: python -m pip install --quiet pytest
      # pytest also runs the unittest-style tests; some tests use pytest fixtures
      - name: Test offline measurement and detector contracts
        run: python -m pytest -q tests
